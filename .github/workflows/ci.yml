name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv sync --all-packages --dev --frozen

      - name: Check formatting
        run: pnpm format:check

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Check JavaScript lint
        run: pnpm lint

      - name: Run JavaScript tests
        run: pnpm test

      - name: Run release readiness repository gate
        run: pnpm release:check

      - name: Build JavaScript services
        run: pnpm build

      - name: Check Python formatting
        run: uv run --project apps/agent-runtime ruff format --check apps/agent-runtime

      - name: Check Python lint
        run: uv run --project apps/agent-runtime ruff check apps/agent-runtime

      - name: Run Python tests
        run: uv run --project apps/agent-runtime pytest apps/agent-runtime/tests
