[project]
name = "payguardian-agent-runtime"
version = "0.1.0"
description = "Phase 0 Python ADK-compatible agent runtime for PayGuardian"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.140.0",
  "google-adk==2.12.0",
  "uvicorn[standard]==0.54.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "openai>=3.46.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.17.1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "F841", "F811"]
